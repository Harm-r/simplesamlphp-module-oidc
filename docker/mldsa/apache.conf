<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /state/keys/tls.crt
    SSLCertificateKeyFile /state/keys/tls.key
    DocumentRoot /lab/public
    Alias /simplesaml /workspace/simplesamlphp-module-oidc/vendor/simplesamlphp/simplesamlphp/public
    <Directory /lab/public>
        Require all granted
        DirectoryIndex index.html
    </Directory>
    <Directory /workspace/simplesamlphp-module-oidc/vendor/simplesamlphp/simplesamlphp/public>
        Require all granted
        AcceptPathInfo On
    </Directory>
    RewriteEngine On
    RewriteRule ^/.well-known/(openid-configuration|openid-federation)$ /simplesaml/module.php/oidc/.well-known/$1 [PT,L]
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
