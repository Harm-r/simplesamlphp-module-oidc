events {}
http {
    resolver 127.0.0.11 ipv6=off valid=5s;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    large_client_header_buffers 4 64k;
    ssl_certificate /pki/server.crt;
    ssl_certificate_key /pki/server.key;
    server {
        listen 9443 ssl;
        server_name ta.127.0.0.1.nip.io;
        location / {
            set $backend http://lighthouse:7672;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/ { return 404; }
    }
    server {
        listen 9443 ssl;
        server_name op.127.0.0.1.nip.io;
        location / {
            set $backend https://op:443;
            proxy_pass $backend;
            proxy_ssl_trusted_certificate /pki/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_server_name on;
            proxy_ssl_name op.127.0.0.1.nip.io;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    server {
        listen 9443 ssl;
        server_name rp.127.0.0.1.nip.io;
        location / {
            set $backend http://offa:15661;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
    server {
        listen 9443 ssl;
        server_name app.127.0.0.1.nip.io;
        location / {
            auth_request /_offa_check;
            error_page 401 = @login;
            auth_request_set $login_url $upstream_http_location;
            auth_request_set $auth_cookie $upstream_http_set_cookie;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            auth_request_set $auth_subject $upstream_http_x_forwarded_subject;
            auth_request_set $auth_provider $upstream_http_x_forwarded_provider;
            auth_request_set $auth_email $upstream_http_x_forwarded_email;
            add_header Set-Cookie $auth_cookie;
            set $app_backend http://app:8000;
            proxy_pass $app_backend;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Subject $auth_subject;
            proxy_set_header X-Forwarded-Provider $auth_provider;
            proxy_set_header X-Forwarded-Email $auth_email;
        }
        location = /_offa_check {
            internal;
            set $auth_backend http://offa:15661/auth;
            proxy_pass $auth_backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length '';
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location @login {
            add_header Set-Cookie $auth_cookie;
            return 303 $login_url;
        }
    }
}
